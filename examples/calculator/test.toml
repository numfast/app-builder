extends = "full.toml"

# Exclude Test extension -- Builder runs tests natively
[[extensions]]
name = "Test"
exclude = true

[tests]
# Calculator arithmetic
add = { mod = "eval_expr", args = ["2+2"], expected = "4" }
sub = { mod = "eval_expr", args = ["10-3"], expected = "7" }
mul = { mod = "eval_expr", args = ["6*7"], expected = "42" }
div = { mod = "eval_expr", args = ["15/3"], expected = "5.0" }
pow = { mod = "eval_expr", args = ["2**10"], expected = "1024" }
sqrt = { mod = "eval_expr", args = ["sqrt(144)"], expected = "12.0" }
modulo = { mod = "eval_expr", args = ["17%5"], expected = "2" }
neg = { mod = "eval_expr", args = ["-5+3"], expected = "-2" }

# Trigonometric
sin_pi2 = { mod = "eval_expr", args = ["sin(pi/2)"], expected = "1.0" }
cos_0 = { mod = "eval_expr", args = ["cos(0)"], expected = "1.0" }
tan_pi4 = { mod = "eval_expr", args = ["tan(pi/4)"], expected = "0.9999999999999999" }
deg_180 = { mod = "eval_expr", args = ["degrees(pi)"], expected = "180.0" }
rad_180 = { mod = "eval_expr", args = ["radians(180)"], expected = "3.141592653589793" }

# Advanced
# (no advanced tests for now -- factorial/hypot not implemented)
